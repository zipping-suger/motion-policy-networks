train_mode: "pretrain"

training_model_parameters:
    flow_sig_min: 0.001
    num_inference_steps: 10
    final_action_clip_value: null
    learning_rate: 1e-4

data_module_parameters:
  data_dir: /data/cabinet_6k
  trajectory_key: 'global_solutions' # Could also use 'global_solutions' for the global expert
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0.015
shared_parameters:
    num_robot_points: 2048  # This will be passed to the model

model_path: null
checkpoint_interval: 10
validation_interval: 3000
gpus: 6 # If > 1, will use DDP for training.
batch_size: 32
save_checkpoint_dir: /workspace/pretrain_flow_matching_cabinet_6k
experiment_name: pretrain_flow_matching_cabinet_6k
description: "pretrain on cabinet_6k with flow matching"