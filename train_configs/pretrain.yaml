train_mode: "pretrain"

training_model_parameters:
    point_match_loss_weight: 1
    collision_loss_weight: 5

data_module_parameters:
  data_dir: /data/cabinet_10k_expert
  trajectory_key: 'global_solutions' # Could also use 'global_solutions' for the global expert
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0.015
shared_parameters:
    num_robot_points: 2048

model_path: /workspace/mpinets_finetune_mpinets_hybrid_training_data_small_hybrid_finetuned_on_small/sp2hrle1/epoch=14-step=17040.ckpt
checkpoint_interval: 10
validation_interval: 200
gpus: 1 # If > 1, will use DDP for training.
batch_size: 32
save_checkpoint_dir: /workspace/bc_cabinet_10k_expert
experiment_name: bc_cabinet_10k_expert
description: "finetune on cabinet 10k expert data with pre-trained mpinets"
