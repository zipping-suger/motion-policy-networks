train_mode: "pretrain"

training_model_parameters:
    point_match_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/mpinets_hybrid_training_data_10k
  trajectory_key: 'global_solutions' # Could also use 'global_solutions' for the global expert
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0.015
shared_parameters:
    num_robot_points: 2048

model_path: null
checkpoint_interval: 10
validation_interval: 3200
gpus: 1 # If > 1, will use DDP for training.
batch_size: 32
save_checkpoint_dir: /workspace/pretrain_10k_checkpoints
max_epochs: 100
experiment_name: "pretrain_10k_experiment"
description: "pretrain with 10k" 
