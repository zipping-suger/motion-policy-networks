train_mode: "pretrain"

training_model_parameters:
    flow_sig_min: 0.001
    num_inference_steps: 20
    final_action_clip_value: 0.05
    learning_rate: 0.0001
    flow_sampling: "uniform"  # NEW: Choose sampling strategy
    flow_alpha: 1.5        # NEW: Beta distribution parameter
    flow_beta: 1.0         # NEW: Beta distribution parameter

data_module_parameters:
  data_dir: /data/cabinet_6k
  trajectory_key: 'global_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0.0
shared_parameters:
    num_robot_points: 2048

model_path: null
checkpoint_interval: 10
validation_interval: 3000
gpus: 1
batch_size: 32
save_checkpoint_dir: /workspace/pretrain_flow_matching_cabinet_6k_uniform
experiment_name: pretrain_flow_matching_cabinet_6k_uniform
description: "pretrain on cabinet_6k with flow matching using uniform sampling"