train_mode: "finetune"

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 5

data_module_parameters:
  data_dir: /data/mpinets_hybrid_training_data
  trajectory_key: 'hybrid_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace/pretrain_50k_checkpoints/jnm8cqg8/epoch=6-step=519643.ckpt
checkpoint_interval: 10
validation_interval: 1000
gpus: 1 # If > 1, will use DDP for training.
batch_size: 32
save_checkpoint_dir: /workspace/finetune_pretrain_50k_checkpoints
max_epochs: 50
experiment_name: finetune_pretrain_50k_experiment
description: "finetune pretrain 50k"
