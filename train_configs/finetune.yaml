train_mode: "finetune"

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/cubby_2k
  trajectory_key: 'global_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace/pretrain_mpinets_hybrid_training_data/m67zonxm/last.ckpt
checkpoint_interval: 10
validation_interval: 10
gpus: 1 # If > 1, will use DDP for training.
batch_size: 48
save_checkpoint_dir: /workspace/finetune_cubby_2k_with_pre_mpinet
max_epochs: 50
experiment_name: finetune_cubby_2k_with_pre_mpinet
description: "cubby 2k"
