train_mode: "finetune"

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/mpinets_hybrid_training_data_small
  trajectory_key: 'hybrid_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace/mpinets_hybrid_training_data_small_pretrain/ysk4bxj9/last.ckpt
checkpoint_interval: 10
validation_interval: 500
gpus: 1 # If > 1, will use DDP for training.
batch_size: 32
save_checkpoint_dir: /workspace/finetune_mpinets_hybrid_training_data_small
max_epochs: 50
experiment_name: finetune_mpinets_hybrid_training_data_small
description: "finetune on mpinets_hybrid_training_data_small with pre-trained mpinets"
