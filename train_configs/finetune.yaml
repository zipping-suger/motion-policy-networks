train_mode: "finetune"

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/mpinets_hybrid_training_data
  trajectory_key: 'hybrid_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace/pretrain_mpinets_hybrid_training_data_small_hybrid/snap/last.ckpt
checkpoint_interval: 10
validation_interval: 10
gpus: 6 # If > 1, will use DDP for training.
batch_size: 48
save_checkpoint_dir: /workspace/mpinets_finetune_mpinets_hybrid_training_data_small_hybrid_finetuned_on_all
experiment_name: mpinets_finetune_mpinets_hybrid_training_data_small_hybrid_finetuned_on_all
description: "finetune mpinets trained on hybrid solutions with 100% of the data"
