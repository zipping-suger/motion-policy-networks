train_mode: "finetune"

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/cabinet_6k
  trajectory_key: 'hybrid_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace/pretrain_cabinet_6k/mauizj51/last.ckpt
checkpoint_interval: 10
validation_interval: 10
gpus: 6 # If > 1, will use DDP for training.
batch_size: 48
save_checkpoint_dir: /workspace/finetune_cabinet_6k
experiment_name: finetune_cabinet_6k
description: "finetune on cabinet_6k dataset with hybrid solutions"
