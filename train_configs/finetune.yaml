train_mode: "finetune"

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/tabletop_tools_complex_65k
  trajectory_key: 'global_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace/pretrain_tabletop_tools_50k/d5de81f1/epoch=2-step=336501.ckpt
checkpoint_interval: 10
validation_interval: 10
gpus: 1 # If > 1, will use DDP for training.
batch_size: 48
save_checkpoint_dir: /workspace/pretrain_finetune_with_tabletop_tools_complex_65k
max_epochs: 50
experiment_name: pretrain_finetune_with_tabletop_tools_complex_65k
description: "Pretrain and finetune on tabletop_tools_complex_65k dataset with diverse tools"