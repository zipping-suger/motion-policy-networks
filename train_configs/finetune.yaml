train_mode: "finetune"

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/mpinets_hybrid_training_data
  trajectory_key: 'hybrid_solutions'
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace//pretrain_mpinets_hybrid_training_data_small_hybrid/n1hwxxua/epoch-epoch=2-end.ckpt
checkpoint_interval: 10
validation_interval: 10
gpus: 6 # If > 1, will use DDP for training.
batch_size: 48
save_checkpoint_dir: /workspace/finetune_small_mpinets_hybrid_training_data_smoothness
max_epochs: 50
experiment_name: finetune_mpinets_hybrid_training_data_smoothness
description: "Finetuning pretrained_on_small on hybrid training data with smoothness loss"
