train_mode: "finetune_tasks"  

training_model_parameters:
    goal_loss_weight: 1
    collision_loss_weight: 10

data_module_parameters:
  data_dir: /data/finetune_tasks_285k
  trajectory_key: 'hybrid_solutions' # Could also use 'global_solutions' for the global expert
  num_obstacle_points: 4096
  num_target_points: 128
  random_scale: 0

shared_parameters:
    num_robot_points: 2048

model_path: /workspace/pretrain_mpinets_hybrid_training_data_tiny/nbiiw6ec/epoch-epoch=7-end.ckpt
checkpoint_interval: 10
validation_interval: 10
gpus: 6 # If > 1, will use DDP for training.
batch_size: 48
save_checkpoint_dir: /workspace/mpinets_finetune_tasks_285k
experiment_name: finetune_tasks
description: "Using tasks dataset for finetuning, no expert is provided."
